  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:description" content="Comprehensive Baccalaureate study companion featuring exam cooldown countdown, time blocking with Notion-style drag-and-drop scheduling, activity stickers, lecture notes, quizzes, deadlines, color-coded priority tracking, dark mode, and multi-device cloud synchronization." />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- DNS Prefetch for faster external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://vcniewfislplbztahaqj.supabase.co">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 transition-colors duration-200 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        const swUrl = window.location.pathname.startsWith('/baccalaureate-study') ? '/baccalaureate-study/sw.js' : '/sw.js';
        const swScope = window.location.pathname.startsWith('/baccalaureate-study') ? '/baccalaureate-study/' : '/';
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(swUrl, { scope: swScope }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
