<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baccalaureate Study Hub</title>
    <meta name="description" content="Comprehensive Baccalaureate study companion featuring exam cooldown countdown, time blocking with Notion-style drag-and-drop scheduling, activity stickers, lecture notes, quizzes, deadlines, color-coded priority tracking, dark mode, and multi-device cloud synchronization." />
    <meta property="og:title" content="Baccalaureate Study Hub" />
    <meta property="og:description" content="Comprehensive Baccalaureate study companion featuring exam cooldown countdown, time blocking with Notion-style drag-and-drop scheduling, activity stickers, lecture notes, quizzes, deadlines, color-coded priority tracking, dark mode, and multi-device cloud synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 antialiased min-h-screen">
    <div id="root">
      <style>
        @keyframes loading-ui-twin-orbit-rotate {
          100% {
            transform: rotate(360deg) translate(155%);
          }
        }
        @keyframes loading-ui-shimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
        .loading-splash-root {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #0c121e;
          color: #f8fafc;
          font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          z-index: 9999;
          overflow: hidden;
        }
        .loading-ambient-glow {
          position: absolute;
          width: 450px;
          height: 450px;
          border-radius: 9999px;
          background: radial-gradient(circle, rgba(13, 148, 136, 0.25) 0%, rgba(79, 70, 229, 0.15) 45%, transparent 70%);
          filter: blur(40px);
          pointer-events: none;
        }
        .loading-card-box {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 24px;
          max-width: 360px;
        }
        .loading-icon-wrap {
          width: 64px;
          height: 64px;
          border-radius: 20px;
          background: linear-gradient(135deg, #14b8a6, #10b981);
          padding: 2px;
          margin-bottom: 20px;
          box-shadow: 0 10px 25px -5px rgba(20, 184, 166, 0.35);
        }
        .loading-icon-bg {
          width: 100%;
          height: 100%;
          background: #0c121e;
          border-radius: 18px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .loading-brand-title {
          font-size: 20px;
          font-weight: 800;
          color: #ffffff;
          margin: 0 0 6px 0;
          letter-spacing: -0.02em;
        }
        .loading-brand-sub {
          font-size: 12px;
          font-weight: 500;
          color: #94a3b8;
          margin: 0 0 28px 0;
        }
        .loading-orbit-area {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 48px;
          margin-bottom: 24px;
        }
        .twin-orbit-core {
          position: relative;
          display: inline-block;
          width: 14px;
          height: 14px;
          aspect-ratio: 1 / 1;
          border-radius: 9999px;
          background-color: #14b8a6;
          box-shadow: 0 0 14px rgba(20, 184, 166, 0.7);
        }
        .twin-orbit-sub-1 {
          position: absolute;
          inset: 0;
          border-radius: 9999px;
          background-color: #2dd4bf;
          transform: rotate(0deg) translate(155%);
          animation: loading-ui-twin-orbit-rotate 1.1s ease infinite;
          box-shadow: 0 0 10px rgba(45, 212, 191, 0.8);
        }
        .twin-orbit-sub-2 {
          position: absolute;
          inset: 0;
          border-radius: 9999px;
          background-color: #38bdf8;
          transform: rotate(0deg) translate(155%);
          animation: loading-ui-twin-orbit-rotate 1.1s ease infinite;
          animation-delay: 0.55s;
          box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        .loading-bar-track {
          width: 180px;
          height: 4px;
          background: rgba(30, 41, 59, 0.8);
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        }
        .loading-bar-shimmer {
          position: absolute;
          inset-block: 0;
          width: 90px;
          background: linear-gradient(90deg, transparent, #14b8a6, transparent);
          border-radius: 9999px;
          animation: loading-ui-shimmer 1.5s ease-in-out infinite;
        }
      </style>
      <div class="loading-splash-root">
        <div class="loading-ambient-glow"></div>
        <div class="loading-card-box">
          <div class="loading-icon-wrap">
            <div class="loading-icon-bg">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.42 10.922a1 1 0 0 0-.019-.838L12.83 2.18a2 2 0 0 0-1.66 0L2.6 10.08a1 1 0 0 0 0 1.832l8.57 7.908a2 2 0 0 0 1.66 0l8.57-7.908a1 1 0 0 0 .02-.89z"></path>
                <path d="M22 10v6"></path>
                <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
              </svg>
            </div>
          </div>
          <h1 class="loading-brand-title">MyBac Study Hub</h1>
          <p class="loading-brand-sub">Lancement de votre espace de travail...</p>
          <div class="loading-orbit-area">
            <span role="status" class="twin-orbit-core">
              <span aria-hidden="true" class="twin-orbit-sub-1"></span>
              <span aria-hidden="true" class="twin-orbit-sub-2"></span>
            </span>
          </div>
          <div class="loading-bar-track">
            <div class="loading-bar-shimmer"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
