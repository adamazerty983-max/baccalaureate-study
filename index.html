<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baccalaureate Study Hub</title>
    <meta name="description" content="Comprehensive Baccalaureate study companion featuring exam cooldown countdown, time blocking with Notion-style drag-and-drop scheduling, activity stickers, lecture notes, quizzes, deadlines, color-coded priority tracking, dark mode, and multi-device cloud synchronization." />
    <meta property="og:title" content="Baccalaureate Study Hub" />
    <meta property="og:description" content="Comprehensive Baccalaureate study companion featuring exam cooldown countdown, time blocking with Notion-style drag-and-drop scheduling, activity stickers, lecture notes, quizzes, deadlines, color-coded priority tracking, dark mode, and multi-device cloud synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 antialiased min-h-screen">
    <div id="root">
      <style>
        :root {
          --sk-bg: #f8fafc;
          --sk-card: #ffffff;
          --sk-border: #e2e8f0;
          --sk-bone: #e2e8f0;
          --sk-shimmer: rgba(255, 255, 255, 0.65);
          --sk-accent: #0d9488;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --sk-bg: #0b1120;
            --sk-card: #111827;
            --sk-border: #1e293b;
            --sk-bone: #1e293b;
            --sk-shimmer: rgba(255, 255, 255, 0.04);
            --sk-accent: #14b8a6;
          }
        }
        .sk-shell {
          display: flex;
          min-height: 100vh;
          background: var(--sk-bg);
          font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .sk-sidebar {
          display: none;
          width: 256px;
          border-right: 1px solid var(--sk-border);
          background: var(--sk-card);
          padding: 24px 16px;
          flex-shrink: 0;
          flex-direction: column;
          gap: 16px;
        }
        @media (min-width: 768px) {
          .sk-sidebar {
            display: flex;
          }
        }
        .sk-brand {
          display: flex;
          align-items: center;
          gap: 12px;
          padding-bottom: 20px;
          border-bottom: 1px solid var(--sk-border);
        }
        .sk-brand-icon {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          background: linear-gradient(135deg, #0d9488, #10b981);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }
        .sk-brand-title {
          font-weight: 800;
          font-size: 15px;
          color: var(--sk-accent);
          letter-spacing: -0.02em;
        }
        .sk-brand-sub {
          font-size: 11px;
          opacity: 0.6;
        }
        .sk-nav {
          display: flex;
          flex-direction: column;
          gap: 8px;
          flex: 1;
        }
        .sk-nav-item {
          height: 38px;
          border-radius: 10px;
          background: var(--sk-bone);
          position: relative;
          overflow: hidden;
        }
        .sk-nav-item.active {
          background: rgba(13, 148, 136, 0.15);
          border: 1px solid rgba(13, 148, 136, 0.25);
        }
        .sk-main {
          flex: 1;
          display: flex;
          flex-direction: column;
          min-width: 0;
        }
        .sk-header {
          height: 64px;
          border-bottom: 1px solid var(--sk-border);
          background: var(--sk-card);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 24px;
        }
        .sk-header-title {
          width: 140px;
          height: 22px;
          border-radius: 6px;
          background: var(--sk-bone);
        }
        .sk-header-actions {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .sk-circle-btn {
          width: 36px;
          height: 36px;
          border-radius: 10px;
          background: var(--sk-bone);
        }
        .sk-content {
          flex: 1;
          max-width: 1200px;
          width: 100%;
          margin: 0 auto;
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        .sk-card {
          border-radius: 20px;
          background: var(--sk-card);
          border: 1px solid var(--sk-border);
          padding: 24px;
          position: relative;
          overflow: hidden;
        }
        .sk-countdown-row {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          margin-top: 16px;
        }
        .sk-countdown-pod {
          height: 80px;
          border-radius: 14px;
          background: var(--sk-bone);
        }
        .sk-grid-3 {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          gap: 16px;
        }
        .sk-kpi-card {
          height: 110px;
          border-radius: 16px;
          background: var(--sk-card);
          border: 1px solid var(--sk-border);
          padding: 16px;
        }
        .sk-shimmer-layer {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, transparent, var(--sk-shimmer), transparent);
          animation: sk-shimmer 1.8s infinite;
          transform: translateX(-100%);
        }
        @keyframes sk-shimmer {
          100% {
            transform: translateX(100%);
          }
        }
      </style>
      <div class="sk-shell">
        <div class="sk-sidebar">
          <div class="sk-brand">
            <div class="sk-brand-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.42 10.922a1 1 0 0 0-.019-.838L12.83 2.18a2 2 0 0 0-1.66 0L2.6 10.08a1 1 0 0 0 0 1.832l8.57 7.908a2 2 0 0 0 1.66 0l8.57-7.908a1 1 0 0 0 .02-.89z"></path>
                <path d="M22 10v6"></path>
                <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
              </svg>
            </div>
            <div class="sk-brand-text">
              <div class="sk-brand-title">Bac Study Hub</div>
              <div class="sk-brand-sub">Espace de travail</div>
            </div>
          </div>
          <div class="sk-nav">
            <div class="sk-nav-item active"></div>
            <div class="sk-nav-item"></div>
            <div class="sk-nav-item"></div>
            <div class="sk-nav-item"></div>
            <div class="sk-nav-item"></div>
            <div class="sk-nav-item"></div>
            <div class="sk-nav-item"></div>
          </div>
          <div class="sk-nav-item" style="height: 48px; border-radius: 12px;"></div>
        </div>
        <div class="sk-main">
          <div class="sk-header">
            <div class="sk-header-title"></div>
            <div class="sk-header-actions">
              <div class="sk-circle-btn"></div>
              <div class="sk-circle-btn"></div>
              <div class="sk-circle-btn" style="width: 80px; border-radius: 18px;"></div>
            </div>
          </div>
          <div class="sk-content">
            <div class="sk-card">
              <div class="sk-shimmer-layer"></div>
              <div style="height: 20px; width: 180px; border-radius: 6px; background: var(--sk-bone);"></div>
              <div style="height: 14px; width: 280px; border-radius: 4px; background: var(--sk-bone); margin-top: 8px; opacity: 0.7;"></div>
              <div class="sk-countdown-row">
                <div class="sk-countdown-pod"></div>
                <div class="sk-countdown-pod"></div>
                <div class="sk-countdown-pod"></div>
                <div class="sk-countdown-pod"></div>
              </div>
            </div>
            <div class="sk-grid-3">
              <div class="sk-kpi-card" style="position: relative; overflow: hidden;"><div class="sk-shimmer-layer"></div></div>
              <div class="sk-kpi-card" style="position: relative; overflow: hidden;"><div class="sk-shimmer-layer"></div></div>
              <div class="sk-kpi-card" style="position: relative; overflow: hidden;"><div class="sk-shimmer-layer"></div></div>
            </div>
            <div class="sk-card" style="height: 240px;">
              <div class="sk-shimmer-layer"></div>
              <div style="height: 18px; width: 160px; border-radius: 6px; background: var(--sk-bone); margin-bottom: 16px;"></div>
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <div style="height: 42px; border-radius: 10px; background: var(--sk-bone); opacity: 0.6;"></div>
                <div style="height: 42px; border-radius: 10px; background: var(--sk-bone); opacity: 0.4;"></div>
                <div style="height: 42px; border-radius: 10px; background: var(--sk-bone); opacity: 0.2;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/baccalaureate-study/sw.js', { scope: '/baccalaureate-study/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
